[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-quality-monitor-backend"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
version = "1.1.0"
description = "Evaluation, regression and drift monitoring for RAG applications"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "SQLAlchemy>=2.0.41,<2.1",
  "alembic>=1.14",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ragm = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# The rule set is explicit so that linting does not silently change with a
# ruff upgrade.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific
  "BLE",  # flake8-blind-except
]
ignore = [
  "B008",   # FastAPI's Depends(...) in defaults is the documented idiom
  "B017",   # pytest.raises(Exception) is used deliberately in a few places
  "E501",   # line length is handled by the formatter
  "RUF012", # mutable class attributes on SQLAlchemy models
  "SIM105", # contextlib.suppress is not clearer everywhere
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "PLC0415"]
"alembic/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:fastapi.*",
]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/rag-evaluation-drift-monitor"
Repository = "https://github.com/sanjaymouraly/rag-evaluation-drift-monitor"
Issues = "https://github.com/sanjaymouraly/rag-evaluation-drift-monitor/issues"
